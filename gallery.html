<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>D&D Club — Photo Gallery (Manual)</title>
  <style>
    :root{
      --brand:#02104f; --ink:#0f172a; --bg:#f7f8fc; --card:#ffffff;
      --muted:#64748b; --ring:rgba(2,16,79,.25); --shadow:0 10px 30px rgba(0,0,0,.12);
      --radius:14px;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;color:var(--ink);background:linear-gradient(180deg,#fff 0%,var(--bg) 100%)}
    header{position:sticky;top:0;z-index:10;background:#fff8;backdrop-filter:saturate(120%) blur(6px);border-bottom:1px solid #e6e9f2}
    .wrap{max-width:1100px;margin:0 auto;padding:16px 20px}
    h1{margin:0;color:var(--brand);font-weight:800;letter-spacing:.2px;font-size:clamp(20px,3.2vw,32px)}
    .sub{margin:6px 0 0;color:var(--muted);font-size:14px}

    .gallery{max-width:1100px;margin:18px auto 36px;padding:0 16px 24px;display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
    .gallery > a{display:block}
    .thumb{display:block;width:100%;height:180px;object-fit:cover;background:#dde3f3;border:0}

    .lightbox{display:none;position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.88);align-items:center;justify-content:center;padding:24px}
    .lightbox-inner{position:relative;max-width:min(96vw,1100px);max-height:90vh;display:flex;align-items:center;justify-content:center}
    .lightbox img{max-width:100%;max-height:90vh;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.45)}
    .lb-close,.lb-prev,.lb-next{
      position:absolute;top:50%;transform:translateY(-50%);
      background:#ffffff;color:var(--brand);text-decoration:none;border-radius:999px;
      width:40px;height:40px;display:grid;place-items:center;font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.25)
    }
    .lb-prev{left:-12px}
    .lb-next{right:-12px}
    .lb-close{top:-14px;right:-14px;transform:none;width:42px;height:42px;background:var(--brand);color:#fff;font-size:22px;line-height:1}
    @media (max-width:520px){.thumb{height:145px}.lb-prev{left:-6px}.lb-next{right:-6px}}
    footer{text-align:center;color:var(--muted);font-size:12px;padding:0 16px 30px}

    /* --- Google Sites anti-jump modal control --- */
    .lightbox { display:none; }
    .lightbox:target { display:none !important; }
    .lightbox.show,
    .lightbox.show:target { display:flex !important; }
    body.modal-open { overflow:hidden; }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <h1>D&D Club — Photo Gallery</h1>
      <p class="sub">Paste your generated rows below and you’re done.</p>
    </div>
  </header>

  <main class="wrap" style="padding-top:14px">
    <!-- Lightboxes BEFORE thumbnails to minimize any residual scroll -->
    <div id="lightboxes">
      <!-- Example of one lightbox; duplicate/adjust IDs and src for all 40 -->
      <!-- Replace these with your full set as needed -->
      <div class="lightbox" id="img1">
        <a class="lb-bg" href="#" aria-label="Close"></a>
        <div class="lightbox-inner">
          <img src="https://raw.githubusercontent.com/ktarverWOS/dnd-club-image-gallery/main/assets/img_gallery01.webp" alt="D&D Club Photo 01">
          <a class="lb-close" href="#" aria-label="Close">&times;</a>
        </div>
      </div>
      <!-- ... add img2 .. img40 similarly or paste your generated blocks -->
    </div>

    <div class="gallery" id="thumbs">
      <!-- Paste your <a href="#imgX"><img class="thumb" src="..."></a> rows here -->
      <a href="#img1"><img class="thumb" src="https://raw.githubusercontent.com/ktarverWOS/dnd-club-image-gallery/main/assets/img_gallery01.webp" alt="D&D Club Photo 01"></a>
      <!-- ... add links to #img2 .. #img40 similarly -->
    </div>
  </main>


  <script>
  // JS-only open/close to avoid iframe scroll on Google Sites
  document.addEventListener('DOMContentLoaded', function () {
    function openLightbox(id){
      document.querySelectorAll('.lightbox.show').forEach(el=>el.classList.remove('show'));
      const el = document.getElementById(id);
      if(el){ el.classList.add('show'); document.body.classList.add('modal-open'); }
    }
    function closeLightbox(){
      document.querySelectorAll('.lightbox.show').forEach(el=>el.classList.remove('show'));
      document.body.classList.remove('modal-open');
    }

    // Intercept ALL links that point to #imgX (thumbs, and if you add prev/next)
    document.addEventListener('click', function(e){
      const a = e.target.closest('a[href^="#img"]');
      if(!a) return;
      e.preventDefault();
      openLightbox(a.getAttribute('href').slice(1));
    });

    // Close on background or ×
    document.addEventListener('click', function(e){
      if(e.target.matches('.lb-bg, .lb-close')){
        e.preventDefault();
        closeLightbox();
      }
    });

    // Esc closes
    document.addEventListener('keydown', function(e){
      if(e.key==='Escape') closeLightbox();
    });

    if(location.hash && /^#img\d+$/i.test(location.hash)){
      try{ history.replaceState(null,'',' ');}catch(_){}
    }
  });
  </script>
</body>
</html>
