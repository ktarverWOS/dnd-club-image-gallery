<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Club Photo Gallery</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #02104f;
      color: #f2f3f5;
    }
    h1 {
      text-align: center;
      padding: 1rem;
      color: #ead1dc;
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 12px;
      padding: 1rem;
    }
    .gallery img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.2s ease;
      background:#0b155b;
    }
    .gallery img:hover {
      transform: scale(1.05);
    }
    /* Lightbox modal */
    .lightbox {
      display: none;
      position: fixed;
      z-index: 9999;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.88);
      justify-content: center;
      align-items: center;
      padding: 24px;
    }
    .lightbox:target { display: flex; }
    .lightbox img {
      max-width: 90%;
      max-height: 90%;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0,0,0,.45);
    }
    .close {
      position: absolute;
      top: 20px;
      right: 30px;
      font-size: 32px;
      color: white;
      text-decoration: none;
      width:42px;height:42px;border-radius:999px;
      display:grid;place-items:center;
      background:#ead1dc;color:#020617;
      box-shadow:0 6px 18px rgba(0,0,0,.25);
    }
  </style>
</head>
