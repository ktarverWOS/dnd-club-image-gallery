<!-- Change position of lightboxes to fix iframe jump -->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <title>D&D Club — Photo Gallery (Manual)</title>
  <style>
    :root{
      --brand:#02104f; --ink:#0f172a; --bg:#f7f8fc; --card:#ffffff;
      --muted:#64748b; --ring:rgba(2,16,79,.25); --shadow:0 10px 30px rgba(2,16,79,.12);
      --radius:14px;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;color:var(--ink);background:linear-gradient(180deg,#fff 0%,var(--bg) 100%)}
    header{position:sticky;top:0;z-index:10;background:#fff8;backdrop-filter:saturate(120%) blur(6px);border-bottom:1px solid #e6e9f2}
    .wrap{max-width:1100px;margin:0 auto;padding:16px 20px}
    h1{margin:0;color:var(--brand);font-weight:800;letter-spacing:.2px;font-size:clamp(20px,3.2vw,32px)}
    .sub{margin:6px 0 0;color:var(--muted);font-size:14px}

    .gallery{max-width:1100px;margin:18px auto 36px;padding:0 16px 24px;display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
    .card{background:var(--card);border:1px solid #e6e9f2;border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease}
    .card:hover,.card:focus-within{transform:translateY(-2px);border-color:var(--ring);box-shadow:0 16px 36px rgba(2,16,79,.18)}
    .thumb{display:block;width:100%;height:180px;object-fit:cover;background:#dde3f3}
    .cap{padding:8px 10px;font-size:13px;color:var(--muted);display:flex;align-items:center;justify-content:space-between;gap:8px}
    .cap b{color:#1f2937;font-weight:600}

    /* turn your <a><img> rows into cards automatically */
    .gallery > a{display:block}
    .gallery > a > img.thumb{height:180px}

    .lightbox{display:none;position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.88);align-items:center;justify-content:center;padding:24px}
    /* .lightbox:target{display:flex} */
    .lightbox-inner{position:relative;max-width:min(96vw,1100px);max-height:90vh;display:flex;align-items:center;justify-content:center}
    .lightbox img{max-width:100%;max-height:90vh;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.45)}
    .lb-close,.lb-prev,.lb-next{
      position:absolute;top:50%;transform:translateY(-50%);
      background:#ffffff;color:var(--brand);text-decoration:none;border-radius:999px;
      width:40px;height:40px;display:grid;place-items:center;font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.25)
    }
    .lb-prev{left:-12px}
    .lb-next{right:-12px}
    .lb-close{top:-14px;right:-14px;transform:none;width:42px;height:42px;background:var(--brand);color:#fff;font-size:22px;line-height:1}
    @media (max-width:520px){.thumb{height:145px}.lb-prev{left:-6px}.lb-next{right:-6px}}
    footer{text-align:center;color:var(--muted);font-size:12px;padding:0 16px 30px}
    .lightbox:target{scroll-margin-top:0}
    .lb-bg{position:fixed;inset:0;display:block;content:""}

    /* Display the lightbox when script adds .show */
    .lightbox.show { display: flex !important; }

    /* Prevent page behind the modal from scrolling */
    body.modal-open { overflow: hidden; }


    /* Stop hash-target from displaying the modal (prevents iframe scroll) */
    .lightbox:target { display: none !important; }

    /* JS-driven show state */
    .lightbox.show { display: flex !important; }

    /* Lock page scroll when modal open */
    body.modal-open { overflow: hidden; }

    /* --- Google Sites anti-jump modal control --- */

    /* default: hidden */
    .lightbox { display: none; }

    /* STOP the hash-based behavior from ever showing or scrolling */
    .lightbox:target { display: none !important; }

    /* JS-driven show state — must come LAST and override everything */
    .lightbox.show,
    .lightbox.show:target {            /* in case a hash slips in */
      display: flex !important;
    }

    /* lock page scroll while a modal is open */
    body.modal-open { overflow: hidden; }

  </style>
</head>

  <script>
document.addEventListener('DOMContentLoaded', function () {

  function openLightbox(id){
    // close any open
    document.querySelectorAll('.lightbox.show').forEach(el => el.classList.remove('show'));
    const el = document.getElementById(id);
    if (el) {
      el.classList.add('show');
      document.body.classList.add('modal-open');
    }
  }

  function closeLightbox(){
    document.querySelectorAll('.lightbox.show').forEach(el => el.classList.remove('show'));
    document.body.classList.remove('modal-open');
  }

  // Intercept ALL links that point to #imgX (thumbs, prev, next)
  document.addEventListener('click', function(e){
    const a = e.target.closest('a[href^="#img"]');
    if (!a) return;

    e.preventDefault();                        // stop the iframe scroll
    const id = a.getAttribute('href').slice(1); // "img12"
    openLightbox(id);
  });

  // Close by clicking background or ×
  document.addEventListener('click', function(e){
    if (e.target.matches('.lb-bg, .lb-close')) {
      e.preventDefault();
      closeLightbox();
    }
  });

  // Esc closes
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape') closeLightbox();
  });

  // If page loaded with a #img… hash, strip it so Sites can't center the iframe
  if (location.hash && /^#img\d+$/i.test(location.hash)) {
    try { history.replaceState(null, '', ' '); } catch(_) {}
  }
});
</script>

</body>
</html>
