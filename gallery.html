<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>D&D Club — Photo Gallery (Manual)</title>
  <style>
    :root{
      --brand:#02104f; --ink:#0f172a; --bg:#f7f8fc; --card:#ffffff;
      --muted:#64748b; --ring:rgba(2,16,79,.25); --shadow:0 10px 30px rgba(2,16,79,.12);
      --radius:14px;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;color:var(--ink);background:linear-gradient(180deg,#fff 0%,var(--bg) 100%)}
    header{position:sticky;top:0;z-index:10;background:#fff8;backdrop-filter:saturate(120%) blur(6px);border-bottom:1px solid #e6e9f2}
    .wrap{max-width:1100px;margin:0 auto;padding:16px 20px}
    h1{margin:0;color:var(--brand);font-weight:800;letter-spacing:.2px;font-size:clamp(20px,3.2vw,32px)}
    .sub{margin:6px 0 0;color:var(--muted);font-size:14px}

    .gallery{max-width:1100px;margin:18px auto 36px;padding:0 16px 24px;display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
    .card{background:var(--card);border:1px solid #e6e9f2;border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease}
    .card:hover,.card:focus-within{transform:translateY(-2px);border-color:var(--ring);box-shadow:0 16px 36px rgba(2,16,79,.18)}
    .thumb{display:block;width:100%;height:180px;object-fit:cover;background:#dde3f3}
    .cap{padding:8px 10px;font-size:13px;color:var(--muted);display:flex;align-items:center;justify-content:space-between;gap:8px}
    .cap b{color:#1f2937;font-weight:600}

    /* turn your <a><img> rows into cards automatically */
    .gallery > a{display:block}
    .gallery > a > img.thumb{height:180px}

    
    footer{text-align:center;color:var(--muted);font-size:12px;padding:0 16px 30px}

        /* Inline Details Panel (inside the grid, Google Sites-safe) */
    .detail-panel{
      grid-column: 1 / -1;
      background: var(--card);
      border: 1px solid #e6e9f2;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      display: none;
      overflow: hidden;
    }
    .detail-panel.open{ display:block; }

    .detail-inner{
      display: grid;
      grid-template-columns: minmax(0,1.1fr) minmax(0,1fr);
      gap: 16px;
      padding: 16px;
      align-items: start;
    }
    .detail-img{
      width: 100%;
      max-height: 70vh;
      object-fit: contain;
      background: #dde3f3;
      border-radius: 12px;
    }
    .detail-title{ font-weight: 700; color: #1f2937; }
    .detail-actions{ display: flex; gap: 10px; align-items: center; margin-top: auto; flex-wrap: wrap; }

    .btn{
      appearance: none;
      border: 1px solid #e6e9f2;
      background: #fff;
      padding: 8px 12px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
    }
    .btn:hover{ border-color: var(--ring); box-shadow: 0 4px 12px rgba(2,16,79,.12); }
    .btn.icon{ width: 38px; height: 38px; display: grid; place-items: center; }

    @media (max-width: 700px){
      .detail-inner{ grid-template-columns: 1fr; }
      .detail-img{ max-height: 50vh; }
    }

  </style>
</head>

    <script>
    const galleryEl = document.getElementById("thumbs");
    const panel     = document.getElementById("detail-panel");
    const links     = Array.from(galleryEl.querySelectorAll(":scope > a"));
    const urls      = links.map(a => {
      const img = a.querySelector("img");
      img.classList.add("thumb");
      return img.src;
    });
    const COUNT = urls.length;
    const state = { current: null };
    const pad2  = n => String(n).padStart(2,"0");

    // Attach click handlers
    links.forEach((a, i) => {
      a.dataset.index = i + 1;
      a.addEventListener("click", (e) => {
        e.preventDefault();
        openPanel(i + 1, a);
      });
    });

    // Keyboard: ESC / arrows
    document.addEventListener("keydown", (e) => {
      if (!panel.classList.contains("open")) return;
      if (e.key === "Escape") closePanel();
      if (e.key === "ArrowLeft")  openPanel(prevIndex(state.current));
      if (e.key === "ArrowRight") openPanel(nextIndex(state.current));
    });

    function prevIndex(i){ return i === 1 ? COUNT : i - 1; }
    function nextIndex(i){ return i === COUNT ? 1 : i + 1; }

    function openPanel(i, afterEl){
      state.current = i;

      // Place the panel after the clicked thumbnail so it feels inline
      if (afterEl && galleryEl.contains(afterEl)) {
        galleryEl.insertBefore(panel, afterEl.nextElementSibling);
      } else {
        galleryEl.appendChild(panel);
      }

      renderPanel(i);
      panel.classList.add("open");
      panel.setAttribute("aria-hidden","false");
      panel.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }

    function closePanel(){
      panel.classList.remove("open");
      panel.setAttribute("aria-hidden","true");
      state.current = null;
    }

    function renderPanel(i){
      const src  = urls[i - 1];
      const prev = prevIndex(i);
      const next = nextIndex(i);

      panel.innerHTML = `
        <div class="detail-inner">
          <img class="detail-img" src="${src}" alt="D&D Club Photo ${pad2(i)}">
          <div class="detail-meta">
            <div class="detail-title">Photo ${pad2(i)}</div>

            <div class="detail-actions">
              <button class="btn icon" data-nav="${prev}" aria-label="Previous">◀</button>
              <button class="btn icon" data-nav="${next}" aria-label="Next">▶</button>

              <a class="btn" href="${src}" target="_blank" rel="noopener">Open full size</a>

              <button class="btn" data-close style="margin-left:auto">Close ✕</button>
            </div>
          </div>
        </div>
      `;

      panel.querySelector("[data-close]").onclick = closePanel;
      panel.querySelectorAll("[data-nav]").forEach(b => {
        b.onclick = () => openPanel(parseInt(b.dataset.nav, 10));
      });
    }
  </script>
